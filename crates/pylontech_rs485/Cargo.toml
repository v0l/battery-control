[package]
name = "pylontech_rs485"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pylontech RS485 console protocol (low-voltage US2000/US3000 family)"
license = "MIT"
repository = "https://github.com/v0l/battery-control"
keywords = ["bms", "battery", "pylontech", "rs485"]
categories = ["hardware-support"]

[dependencies]
thiserror = "2.0"
log = "0.4"
async-trait = "0.1"
tokio-serial = { version = "5", optional = true }
tokio = { version = "1", features = ["rt", "time", "io-util", "macros"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }

[features]
default = ["serial"]
serial = ["dep:tokio-serial", "dep:tokio"]
cli = ["serial", "dep:clap", "dep:env_logger", "tokio/rt-multi-thread", "tokio/macros"]

[[bin]]
name = "pylontool"
path = "src/bin/pylontool/main.rs"
required-features = ["cli"]
