[package]
name = "ecoflow"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "EcoFlow power station protocol (local BLE, encrypted) — no cloud"
license = "MIT"
repository = "https://github.com/v0l/battery-control"
keywords = ["ecoflow", "power-station", "bluetooth", "solar"]
categories = ["hardware-support"]

[dependencies]
thiserror = "2.0"
log = "0.4"
async-trait = "0.1"

# crypto core (deterministic, always available)
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
rand = "0.8"

# transport (feature-gated; Stage 2)
btleplug = { version = "0.12", optional = true }
uuid = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "time", "sync", "io-util", "macros"], optional = true }
futures-util = { version = "0.3", optional = true }

[features]
default = []
bluetooth = ["dep:btleplug", "dep:uuid", "dep:tokio", "dep:futures-util"]
