[package]
name = "jbd_bms"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "JBD / Xiaoxiang / Overkill Solar / LLT BMS protocol (0xDD frames) over BLE and serial"
license = "MIT"
repository = "https://github.com/v0l/battery-control"
keywords = ["bms", "battery", "jbd", "xiaoxiang", "bluetooth"]
categories = ["hardware-support"]

[dependencies]
thiserror = "2.0"
log = "0.4"
async-trait = "0.1"
ble_util = { path = "../ble_util", version = "0.1" }

# transports (feature-gated)
btleplug = { version = "0.12", optional = true }
uuid = { version = "1", optional = true }
tokio-serial = { version = "5", optional = true }
tokio = { version = "1", features = ["rt", "time", "sync", "io-util", "macros"], optional = true }
futures-util = { version = "0.3", optional = true }

# CLI
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
env_logger = { version = "0.11", optional = true }

[features]
default = ["bluetooth"]
bluetooth = ["dep:btleplug", "dep:uuid", "dep:tokio", "dep:futures-util", "ble_util/gatt"]
serial = ["dep:tokio-serial", "dep:tokio", "dep:futures-util"]
cli = ["bluetooth", "serial", "dep:clap", "dep:serde", "dep:serde_json", "dep:env_logger", "tokio/rt-multi-thread", "tokio/macros"]

[[bin]]
name = "jbdtool"
path = "src/bin/jbdtool/main.rs"
required-features = ["cli"]
