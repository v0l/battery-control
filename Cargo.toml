[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "battery_control"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "One async trait to monitor and control batteries across many BMS/power-station backends (Anker SOLIX, JK, Daly, Victron, Pylontech CAN, ...)"
license = "MIT"
repository = "https://github.com/v0l/battery-control"
keywords = ["battery", "bms", "solar", "bluetooth", "modbus"]
categories = ["hardware-support", "api-bindings"]

[dependencies]
async-trait = "0.1"
thiserror = "2.0"
log = "0.4"
bitflags = "2.6"
serde = { version = "1.0", features = ["derive"] }
# `Stream` trait for real-time telemetry (tiny, no_std core traits only).
futures-core = "0.3"

# CLI (feature = "cli")
clap = { version = "4.5", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
env_logger = { version = "0.11", optional = true }

# shared async runtime for the wrapping backends
tokio = { version = "1", features = ["rt", "time", "sync", "io-util", "macros"], optional = true }
futures-util = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", optional = true }

# --- backend crates (each feature-gated) ---
anker_solix = { git = "https://github.com/v0l/anker-rs.git", rev = "b7b110946f8d860367f92a162b6e8f33c828248b", version = "0.4", optional = true }
jk_bms = { version = "0.5", optional = true, default-features = false }
jbd_bms = { path = "crates/jbd_bms", version = "0.1", optional = true, default-features = false }
# used only for serial port *enumeration* during discovery
tokio-serial = { version = "5", optional = true }
dalybms = { version = "0.1", optional = true, default-features = false, features = ["tokio-serial-async"] }
victron_ble = { version = "1", optional = true }
vedirect = { version = "0.2", optional = true }
socketcan = { version = "3", optional = true }

[features]
default = ["anker", "pylontech-can"]

# Async plumbing shared by every live backend; enables the unified
# `Battery::updates` stream (native push or poll-and-diff fallback).
runtime = ["dep:tokio", "dep:futures-util"]

# Wrapping backends
anker = ["dep:anker_solix", "runtime"]
# JK BMS: `jk-ble` and `jk-serial` can be enabled independently (e.g. mobile
# builds are BLE-only); `jk` is the convenience union of both.
jk = ["jk-ble", "jk-serial"]
jk-ble = ["dep:jk_bms", "jk_bms/bluetooth", "runtime"]
jk-serial = ["dep:jk_bms", "jk_bms/serial", "runtime", "dep:tokio-serial"]
# JBD / Xiaoxiang / Overkill Solar BMS. Same split as JK: BLE and serial are
# independently selectable; `jbd` is the union.
jbd = ["jbd-ble", "jbd-serial"]
jbd-ble = ["dep:jbd_bms", "jbd_bms/bluetooth", "runtime"]
jbd-serial = ["dep:jbd_bms", "jbd_bms/serial", "runtime", "dep:tokio-serial"]
daly = ["dep:dalybms", "runtime", "dep:tokio-serial"]
victron = ["dep:victron_ble", "runtime", "dep:tokio-stream"]
vedirect = ["dep:vedirect"]

# Native protocol decoders
# The Pylontech CAN *decoder* is pure and cross-platform (always testable).
pylontech-can = []
# The CAN *socket* transport is Linux-only (BlueZ-style socketcan).
can-socket = ["dep:socketcan", "pylontech-can"]

# Convenience: everything that builds on the host (no Linux-only CAN socket).
full = ["anker", "jk", "jbd", "daly", "victron", "vedirect", "pylontech-can"]

# The `battery` CLI: BLE + serial discovery across backends.
cli = [
    "anker", "jk", "jbd", "daly", "pylontech-can",
    "dep:clap", "dep:serde_json", "dep:env_logger",
    "tokio/rt-multi-thread", "tokio/macros",
]

[[bin]]
name = "battery"
path = "src/bin/battery/main.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
features = ["full"]
