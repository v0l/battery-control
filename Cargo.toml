[package]
name = "jk_bms"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Async library and CLI (jktool) for JIKONG (JK) Battery Management Systems over Serial, Bluetooth LE and CAN"
license = "MIT"
readme = "README.md"
repository = "https://github.com/v0l/jktool-rs"
homepage = "https://github.com/v0l/jktool-rs"
documentation = "https://docs.rs/jk_bms"
keywords = ["bms", "battery", "jikong", "bluetooth", "can"]
categories = ["embedded", "hardware-support", "command-line-utilities", "asynchronous"]
exclude = [
    ".github/",
    "Dockerfile",
    "CAN_USAGE.md",
]

[dependencies]
thiserror = "2.0"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "net", "io-util"] }
btleplug = { version = "0.12", optional = true }
uuid = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
tokio-serial = { version = "5.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "3.6", features = ["tokio"], optional = true }

[features]
# `can` pulls SocketCAN only on Linux (see the target-specific dependency below);
# it is inert on other platforms, so keeping it in the default set is safe.
default = ["bluetooth", "serial", "can"]
bluetooth = ["dep:btleplug", "dep:uuid", "dep:futures-util"]
serial = ["dep:tokio-serial"]
can = ["dep:socketcan"]

[lib]
name = "jk_bms"
path = "src/lib.rs"

[[bin]]
name = "jktool"
path = "src/bin/jktool/main.rs"
